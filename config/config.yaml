# SNAP-HiC-Diff Window Comparison Pipeline Configuration

# ============================================================================
# Input
# ============================================================================
manifest: "data/manifest.tsv"

# ============================================================================
# Output
# ============================================================================
outdir: "results"
tmpdir: "tmp"

# ============================================================================
# Convert .cool to .mcool (hictk zoomify)
# ============================================================================
convert:
  resolutions: [4000, 8000, 10000, 20000, 100000]
  threads: 20

# ============================================================================
# Analysis Parameters
# ============================================================================
resolution: 4000           # 4kb bins (finest available in mcool)
window_size: 300000       # 300kb windows
step_size: 32000          # 32kb step (sliding window)

# ============================================================================
# Samples (loaded dynamically from manifest.tsv - do not hardcode here)
# ============================================================================

# ============================================================================
# hictk Parameters
# ============================================================================
hictk:
  balance:
    ignore_diags: 2        # Ignore first 2 diagonals during balance
  threads: 10              # Threads per hictk job

# ============================================================================
# QC Thresholds (Custom Set)
# ============================================================================
qc:
  # Dynamic P20 thresholds (per chromosome, applied after all windows)
  dynamic_raw_sum_cpm_pct: 10      # Percentile for raw_sum_cpm + nz_frac dynamic threshold (0 = disabled)
  max_bad_bin_frac: 0.5         # Maximum gap bin fraction

# NaN-Density Breakpoint Detection (ICE matrix with gap mask)
nan_density_breakpoint:
  abnormal_threshold: 0.60      # Upper band zero+NaN fraction threshold (>50% = abnormal)

# Gap Detection Parameters (sliding window)
gap:
  gradient_threshold: 10.0       # Min ratio for breakpoint detection (reference detect_gaps.py)
  min_low_ratio: 0.001          # Min fraction of low bins in a valid gap window

# ============================================================================
# Smoothing Parameters
# ============================================================================
smoothing:
  sigma: 1.0                    # Gaussian kernel sigma

# ============================================================================
# Parallelization
# ============================================================================
parallel:
  threads_per_job: 80          # Threads per compute job (passed to joblib)


# ============================================================================
# Tracy-Widom Parameters
# ============================================================================
tracy_widom:
  min_nbin: 10                # Minimum valid bins for TW test
  na_fraction: 0.5            # Max fraction of NaN/zero in rows (filter threshold)

# ============================================================================
# KNN Empirical P-Value Parameters
# ============================================================================
knn_empirical_pvalue:
  background_file: "/share/home/xhhuang24/project/PanTE/background_pool/results/window_compare/HiC_window_background.tsv"
  knn_k: 10000
  knn_metric: "euclidean"
  scaler: "robust"
  score_columns:
    - MSE
    - d_SSIM
    - d_Spearman
    - tw_score
    - d_NCC
  derive_scores:
    d_SSIM: "1 - SSIM"
    d_Spearman: "1 - Spearman"
    tw_score: "-log10(max(tw_pvalue, 1e-30))"
    d_NCC: "1 - NCC"
  pvalue_direction:
    MSE: "greater"
    d_SSIM: "greater"
    d_Spearman: "greater"
    tw_score: "greater"
    d_NCC: "greater"
  # compute_fdr removed: raw empirical p-values are the canonical output
  n_jobs: 80                        # joblib parallel threads for per-window p-value computation

# ============================================================================
# KNN Significant Heatmap Parameters
# ============================================================================
knn_significant_heatmap:
  pvalue_threshold: 0.05          # raw empirical p-value threshold for significance
  pass_mode: "all"                # all | any | subset
  metrics:
    - MSE
    - d_SSIM
    - d_Spearman
    - tw_score
    - d_NCC

# ============================================================================
# Window Compare Parameters
# ============================================================================
window_compare:
  pairs_file: "data/window_compare_pairs.yaml"   # Path to comparison pairs config
  covariates:
    cpm_column: "raw_sum_cpm"       # CPM column from window QC
    nz_column: "nz_frac"              # NZ fraction column from window QC
    pseudocount_cpm: 0.01             # Pseudocount for CPM
    weights:
      EC: 0.33                       # Weight for Enrichment Correlation
      IB: 0.33                       # Weight for Interaction Balance
      SP: 0.33                       # Weight for Short-range Contacts
  gaussian_metrics:
    n_jobs: 80                       # Parallel jobs for Gaussian comparison
  tw:
    n_jobs: 80                       # Parallel jobs for Tracy-Widom test

# ============================================================================
# Meltron Parameters
# ============================================================================
meltron:
  cores: 20
  cworld_is:
    source_resolution_bp: 4000  # integer >= 1000; must match the balanced .cool bin size
    is_distances_bp: [32000, 60000, 92000, 120000, 152000,
                      180000, 212000, 240000, 272000, 300000]
    ids_divisor: 2
    chrom_job_threads: 2
    merge_job_threads: 2
  # Meltron run parameters
  comparison_directions: [decondensation, condensation]  # run both per comparison
  cutoff_na: 0.5          # acceptable fraction of missing IS values per interval
  # Scoring
  score_threshold: 5.0    # advisory threshold for melting_score (-log10(Bonferroni pval))
                          # NOTE: not genome-wide significance; calibrate empirically with null windows
  # Candidate selection (per Phase 03 FDR output)
  min_significant: 1      # min metrics with FDR < 0.05 to enter Meltron (1 = any strong signal)

# ============================================================================
# IS-change Parameters
# ============================================================================
is_change:
  raw_knn_pvalue_threshold: 0.05
  meltron_score_threshold: 5.0
  merge_gap_bp: 0
  context_bp: 300000
  local_radius_bins: 1
  min_local_valid_fraction: 0.6666666666666666
  flank_fraction_of_scale: 0.25
  min_flank_bins: 2
  min_flank_valid_fraction: 0.80
  max_missing_run_bins: 1
  high_percentile: 0.95
  broad_percentile: 0.90
  spatial_cluster_tolerance_bp: 12000
  min_primary_scale_bands: 2
  scale_bands:
    small: [32000, 60000, 92000]
    medium: [120000, 152000, 180000]
    large: [212000, 240000, 272000, 300000]
  diagnostic_plot_top_n: 50

# ============================================================================
# TAD Parameters
# ============================================================================
tad:
  resolutions: [4000, 8000, 20000]
  signals: [raw, balanced]
  threads: 20
  parameter_set: D
  run_root: results/tad_runs
  code_dir: scripts/python3_3dnetmod
  badregionfilter: false
  bad_region_bed: null
  excluded_chromosomes: []
  d:
    region_size_bins: 150
    overlap_bins: 100
    logged: true
    scale: genomewide
    plateau: 3
    chaosfilter: true
    chaos_pct: 0.9
    max_gamma: 3.2
    num_part: 20
    plots: false
    pctile_threshold: 0
    pct_value: 0
    final_consistent_domains: true
    size_threshold_bins: 4
    boundary_buffer_bins: 8
    size_bins: [100, 200, 400, 750, 3000]
    variance_thresholds: [45, 45, 60, 45, 45]
    resolution_overrides:
      4000:
        size_threshold_bins: 10
        variance_thresholds: [20, 20, 30, 20, 20]

# ============================================================================
# Dsub Parameters
# ============================================================================
# Note: memory/disk are auto-allocated by queue (arm: 5GB/core)
dsub:
  queue: "arm"
  cpu: 80                      # 80 cores = 400GB memory (arm queue)
